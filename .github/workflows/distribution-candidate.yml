name: Candidat APK Le Fil - distribution
on:
  workflow_dispatch:
  push:
    branches: [distribution-directe]
    paths:
      - '.github/workflows/distribution-candidate.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  candidat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler et contrôler
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk | tee apk-sha256.txt
      - name: Installer et lancer Le Fil sur Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path net.lefil.fdroid | grep -q package:
            adb shell monkey -p net.lefil.fdroid 1
            sleep 10
            adb shell pidof net.lefil.fdroid
      - uses: actions/upload-artifact@v4
        with:
          name: lefil-candidat-debug-non-publiable
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
          if-no-files-found: error
