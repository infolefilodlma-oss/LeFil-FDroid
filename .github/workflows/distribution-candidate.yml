name: Candidat APK Le Fil - distribution
on:
  workflow_dispatch:
  push:
    branches: [distribution-directe]
    paths:
      - '.github/workflows/distribution-candidate.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
permissions:
  contents: read
jobs:
  candidat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler et contrôler
        run: |
          gradle --no-daemon :app:assembleDebug :app:lintDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lefil-candidat-debug-non-publiable
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
