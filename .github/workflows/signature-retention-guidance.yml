name: Android - key retention official guidance

on:
  push:
    branches: [codex/direct-release-0.2.1]
    paths:
      - .github/workflows/signature-retention-guidance.yml
      - tools/read_signature_retention_guidance.py

permissions:
  contents: write

jobs:
  official-public-guidance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Android, OWASP and F-Droid guidance without private material
        run: python3 tools/read_signature_retention_guidance.py
      - name: Record public documentation evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/distribution-assurance-0.2.1/official-guidance.json
          git commit -m 'Record official key backup and signature continuity guidance [skip ci]'
          git pull --rebase origin codex/direct-release-0.2.1
          git push origin HEAD:refs/heads/codex/direct-release-0.2.1
