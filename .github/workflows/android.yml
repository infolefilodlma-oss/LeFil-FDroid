name: Android - verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - work/gotify-native-integration
      - work/notifications-natives
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'
      - 'tools/check_public_https.py'

permissions:
  contents: read

jobs:
  public-https:
    runs-on: ubuntu-latest
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Verifier HTTPS public Agora et Talk sans identifiants
        run: python3 tools/check_public_https.py
      - name: Conserver le diagnostic HTTPS anonyme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-public-https-report
          path: public-https-report.json
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verifier les sources Android
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -d app/src/main
      - name: Tester les lecteurs de messages
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verifier Android Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Compiler la version de test
        run: gradle --no-daemon :app:assembleDebug
      - name: Compiler le candidat release non signe
        run: gradle --no-daemon :app:assembleRelease
      - name: Conserver le candidat release non signe
        uses: actions/upload-artifact@v4
        with:
          name: lefil-release-unsigned-candidate
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
      - name: Conserver le resultat de compilation
        uses: actions/upload-artifact@v4
        with:
          name: lefil-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Conserver les rapports de controle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
