name: Android - verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verifier les sources Android
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -d app/src/main
      - name: Verifier acces public Agora et Atrium (sans identifiants)
        shell: bash
        run: |
          for url in https://social.le-fil.net/message https://team.le-fil.net/mail/mail/notification-list; do
            echo "Controle public: $url"
            curl --silent --show-error --location --max-time 15 --output /dev/null \
              --write-out 'HTTP final: %{http_code}; destination: %{url_effective}\n' "$url" || true
          done
      - name: Tester les lecteurs de messages
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verifier Android Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Compiler la version de test
        run: gradle --no-daemon :app:assembleDebug
      - name: Conserver le resultat de compilation
        uses: actions/upload-artifact@v4
        with:
          name: lefil-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
