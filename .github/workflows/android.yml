name: Android - verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verifier les sources Android
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -d app/src/main
      - name: Compiler la version de test
        run: gradle --no-daemon :app:assembleDebug
      - name: Conserver le resultat de compilation
        uses: actions/upload-artifact@v4
        with:
          name: lefil-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
