name: Android - direct release readiness

on:
  workflow_dispatch:
  push:
    branches:
      - codex/direct-release-0.2.1
    paths:
      - .github/workflows/direct-release.yml
      - tools/direct_release_preflight.py
      - tools/check_release_installation.py

permissions:
  contents: write
  actions: read

jobs:
  signing-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release prerequisites without exposing or creating signing keys
        env:
          GH_TOKEN: ${{ github.token }}
          LEFIL_KEYSTORE_CONFIGURED: ${{ secrets.LEFIL_SIGNING_KEYSTORE_BASE64 != '' }}
          LEFIL_STORE_PASSWORD_CONFIGURED: ${{ secrets.LEFIL_SIGNING_STORE_PASSWORD != '' }}
          LEFIL_KEY_PASSWORD_CONFIGURED: ${{ secrets.LEFIL_SIGNING_KEY_PASSWORD != '' }}
        run: python3 tools/direct_release_preflight.py
      - name: Retain public evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-direct-release-readiness
          path: docs/validation/direct-release/preflight.json
          if-no-files-found: error
      - name: Preserve the public result on the dedicated distribution branch
        if: always() && github.ref == 'refs/heads/codex/direct-release-0.2.1'
        run: |
          test -f docs/validation/direct-release/preflight.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/direct-release/preflight.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record direct distribution access and signing prerequisites [skip ci]'
          git push origin HEAD:refs/heads/codex/direct-release-0.2.1

  release-build-and-install:
    needs: signing-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release twice from clean pinned sources and sign for disposable installation checks only
        run: python3 tools/check_release_installation.py build
      - name: Enable KVM in the disposable runner
        run: sudo chmod 666 /dev/kvm
      - name: Install and start the non-debuggable release on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tools/check_release_installation.py install
      - name: Remove the disposable test key and password
        if: always()
        run: python3 tools/check_release_installation.py cleanup
      - name: Retain reports and actual emulator captures, never APKs or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-release-installation-evidence
          path: |
            docs/validation/direct-release/release-checks.json
            docs/validation/direct-release/release-*.log
            docs/validation/direct-release/release-*.xml
            docs/validation/direct-release/release-*.png
          if-no-files-found: error
      - name: Preserve release build and installation evidence on the dedicated branch
        if: always() && github.ref == 'refs/heads/codex/direct-release-0.2.1'
        run: |
          test -f docs/validation/direct-release/release-checks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/validation/direct-release/release-*
          git commit -m 'Record release build reproducibility and Android 15 installation checks [skip ci]'
          git pull --rebase origin codex/direct-release-0.2.1
          git push origin HEAD:refs/heads/codex/direct-release-0.2.1
