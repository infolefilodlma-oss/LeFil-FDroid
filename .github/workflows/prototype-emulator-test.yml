name: Prototype - test emulateur (notifications reseau)

# Restreint a la branche experimentale : ne se declenche jamais sur main.
on:
  push:
    branches:
      - 'prototype/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - name: Sources
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests instrumentes sur emulateur Android reel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          script: |
            adb logcat -c
            gradle --no-daemon connectedDebugAndroidTest
            adb logcat -d > logcat-test.txt

      - name: Conserver les preuves (journal + resultats)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-emulator-proof
          path: |
            logcat-test.txt
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
