name: Preserve the verified F-Droid build report

on:
  push:
    branches:
      - codex/fdroid-submission-readiness
    paths:
      - .github/workflows/collect-verification-reports.yml

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lefil-fdroid-submission-checks
          run-id: 39011672052
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/fdroid-report
      - name: Preserve only the verified result and text logs
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import json
          import os
          import re
          import shutil
          source = Path(os.environ['RUNNER_TEMP']) / 'fdroid-report'
          report = json.loads((source / 'result.json').read_text())
          assert report['source_commit'] == '99789aa0f9c82d90cef020b33444698a05aafc47'
          assert all(report[key] == 'passed' for key in ('outcome', 'readmeta', 'lint', 'apk_build', 'source_scan', 'binary_scan'))
          assert re.fullmatch('[0-9a-f]{64}', report['apk_sha256'])
          assert report['submitted'] is False and report['accepted'] is False
          target = Path('docs/validation/branding/fdroid')
          target.mkdir(parents=True, exist_ok=True)
          for name in ('result.json', 'readmeta.log', 'lint.log', 'build.log'):
              shutil.copyfile(source / name, target / name)
          print('::notice::Original F-Droid report preserved: pinned source built and scanned successfully; no submission or APK publication')
          CHECK
      - name: Save evidence on the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/branding/fdroid
          git commit -m 'Preserve the actual F-Droid candidate build and scan report'
          git pull --rebase origin codex/fdroid-submission-readiness
          git push origin HEAD:refs/heads/codex/fdroid-submission-readiness
