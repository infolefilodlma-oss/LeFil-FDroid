name: Android - preserve completed release checks

on:
  push:
    branches:
      - codex/direct-release-0.2.1
    paths:
      - .github/workflows/direct-release-evidence.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve-existing-results:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '39028853518'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve the existing reports without running builds or Android again
        run: |
          gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url,headSha,jobs > "$RUNNER_TEMP/release-source-run.json"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name lefil-release-installation-evidence --dir "$RUNNER_TEMP/release-evidence"
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'release-evidence'
          output = Path('docs/validation/direct-release')
          output.mkdir(parents=True, exist_ok=True)
          copied = {}
          for file in source.rglob('*'):
              if file.is_file() and file.name.startswith('release-') and file.suffix in ('.json', '.log', '.png', '.xml'):
                  shutil.copyfile(file, output / file.name)
                  copied[file.name] = hashlib.sha256(file.read_bytes()).hexdigest()
          assert 'release-checks.json' in copied, 'Original release report is missing'
          original = json.loads((output / 'release-checks.json').read_text())
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release-source-run.json').read_text())
          build = next(job for job in run['jobs'] if job['name'] == 'release-build-and-install')
          result = {
              'recovered_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_run': run,
              'original_report_outcome': original['outcome'],
              'recovery_run_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'original_files_copied_without_modification': copied,
              'failed_source_steps': [step['name'] for step in build['steps'] if step['conclusion'] == 'failure'],
              'builds_and_android_tests_rerun_for_recovery': False,
              'production_release_published': False,
          }
          (output / 'evidence-provenance.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Preserve only public reports and captures, including explicitly ignored logs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/validation/direct-release/release-*
          git add docs/validation/direct-release/evidence-provenance.json
          git commit -m 'Recover completed release checks without repeating builds or installation [skip ci]'
          git push origin HEAD:refs/heads/codex/direct-release-0.2.1
      - name: Verify recovered checks while preserving the original source-run failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path('docs/validation/direct-release')
          report = json.loads((root / 'release-checks.json').read_text())
          proof = json.loads((root / 'evidence-provenance.json').read_text())
          assert report['outcome'] == 'release_build_and_disposable_key_installation_checks_passed', report
          assert report['reproducibility']['exact_unsigned_match'] is True
          assert proof['failed_source_steps'] == ['Preserve release build and installation evidence on the dedicated branch'], proof['failed_source_steps']
          print('Original release build and installation checks passed; only evidence staging failed. No APK published.')
          PY
