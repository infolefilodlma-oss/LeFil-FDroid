name: F-Droid - submission checks

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fdroid-submission-readiness
    paths:
      - docs/fdroid/net.lefil.fdroid.yml
      - tools/check_fdroid_submission.py
      - .github/workflows/fdroid-submission.yml

permissions:
  contents: write

jobs:
  fdroid-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install official F-Droid tools in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-venv"
          "$RUNNER_TEMP/fdroid-venv/bin/pip" install fdroidserver==2.4.5
      - name: Check metadata and build the pinned source with source and binary scans
        run: >-
          "$RUNNER_TEMP/fdroid-venv/bin/python" tools/check_fdroid_submission.py
          --work-dir "$RUNNER_TEMP/fdroid-review" --build
      - name: Retain reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lefil-fdroid-submission-checks
          path: |
            ${{ runner.temp }}/fdroid-review/*.log
            ${{ runner.temp }}/fdroid-review/result.json
          if-no-files-found: error
      - name: Preserve the exact candidate result and its provenance
        if: always() && github.ref == 'refs/heads/codex/fdroid-submission-readiness'
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          import shutil
          source = Path(os.environ['RUNNER_TEMP']) / 'fdroid-review' / 'result.json'
          if source.is_file():
              target = Path('docs/validation/fdroid-finalization')
              target.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target / 'fdroid-result.json')
              (target / 'fdroid-provenance.json').write_text(json.dumps({
                  'recorded_at_utc': datetime.now(timezone.utc).isoformat(),
                  'workflow_commit': os.environ['GITHUB_SHA'],
                  'run_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                  'jvm_tests_rerun': False, 'native_tests_rerun': False,
                  'official_gitlab_ci': False, 'apk_published': False
              }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/fdroid-finalization/fdroid-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record the exact F-Droid candidate metadata, build and scan results'
          git pull --rebase origin codex/fdroid-submission-readiness
          git push origin HEAD:refs/heads/codex/fdroid-submission-readiness
