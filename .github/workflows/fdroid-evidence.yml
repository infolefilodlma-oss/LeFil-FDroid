name: F-Droid - remaining compliance evidence

on:
  push:
    branches:
      - codex/fdroid-submission-readiness
    paths:
      - .github/workflows/fdroid-evidence.yml
      - tools/report_fdroid_dependencies.init.gradle
      - tools/collect_fdroid_network_evidence.py

permissions:
  contents: write
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEFIL_RUNTIME_REPORT: ${{ runner.temp }}/runtime-dependencies.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover the existing HTTPS result without repeating its checks
        uses: actions/download-artifact@v4
        with:
          name: lefil-public-https-report
          run-id: 39010816563
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: docs/validation/fdroid-finalization
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Resolve the existing release runtime graph without building or testing
        run: gradle --no-daemon --init-script tools/report_fdroid_dependencies.init.gradle :app:fdroidDependencyEvidence
      - name: Install the isolated public-page observer
        run: |
          python3 -m venv "$RUNNER_TEMP/network-observer"
          "$RUNNER_TEMP/network-observer/bin/pip" install playwright==1.56.0
          "$RUNNER_TEMP/network-observer/bin/playwright" install --with-deps chromium
      - name: Collect license declarations and observe only anonymous read requests
        run: '"$RUNNER_TEMP/network-observer/bin/python" tools/collect_fdroid_network_evidence.py'
      - name: Preserve observations and explicit failures on the development branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/validation/fdroid-finalization
          if ! git diff --cached --quiet; then
            git commit -m 'Record remaining F-Droid network and runtime dependency evidence (${{ job.status }})'
            git pull --rebase origin codex/fdroid-submission-readiness
            git push origin HEAD:refs/heads/codex/fdroid-submission-readiness
          fi
