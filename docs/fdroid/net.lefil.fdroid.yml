MaintainerNotes: |-
  Candidate 0.2.7-test, versionCode 11, commit
  85cbe966f3948a6fac9b690c82a21e2531cc25e1. Superseded candidate
  0.2.1/versionCode 3 (commit 25189d316d8345a601b4dae2fa9987d286831d1e)
  is kept only as prior validation history, not as the proposal.
  Message delivery now uses WorkManager, a periodic ~15-minute check
  (no Gotify, no permanent foreground service), consolidated into a
  single Android notification per cycle. This was validated on a
  physical phone (Samsung) on 2026-10-24; pagination and exhaustive
  delivery over long periods remain unverified.
  Native recovery was tested in an Android 15 emulator using local HTML;
  this did not test authenticated services end to end.
  Web pages automatically load Google Fonts (fonts.googleapis.com and
  fonts.gstatic.com); the homepage also loads WordPress emoji from s.w.org.
  Third-party cookies are enabled. These web requests are disclosed
  upstream; absence of GMS/Firebase is a native dependency claim.
  Signing: decision made on 2026-10-24 to use standard F-Droid signing
  for this submission (F-Droid builds and signs with its own key, as is
  usual for the main repo). The project's own "v2" release key
  (certificate SHA-256
  ec6b47258ca1acd76a5855ce06b533017eb893b544fb95b1db867c57d71efccc,
  active since 2026-10-23) is kept for direct distribution on le-fil.net
  only and is not submitted here; see
  docs/release/SIGNING-KEY-V2-DECISION.md. Devices installed from
  F-Droid and devices installed directly from le-fil.net use different
  signatures and cannot update in place from one channel to the other;
  this is an accepted consequence of the choice, not a defect.
  A separate "developer-signed" recipe variant exists
  (docs/release/net.lefil.fdroid.developer-signed.yml) but is not part
  of this submission.
  Local compilation from source was verified on 2026-10-24: a clean
  Gradle 8.7 / JDK 17 build (`gradle clean :app:assembleRelease`) at
  commit 85cbe966f3948a6fac9b690c82a21e2531cc25e1 completed
  successfully (45 of 46 tasks freshly executed, not cached), producing
  an unsigned release APK, SHA-256
  af51a239638ceda18441059fa0aa5692b6f0ee4506b24e32b456db9a6683af82.
  This confirms the recipe's commit/subdir/gradle declaration is
  buildable as stated. It is a successful compilation, not a
  demonstrated reproducible build: no independent second build (by
  F-Droid's own infrastructure or otherwise) has been compared against
  this output.
  Review of the Quality Control user exception is requested: public history
  starts on 2026-10-14, and the project representative reported a candidate
  trial on a phone. No user count or accepted exception is claimed.

