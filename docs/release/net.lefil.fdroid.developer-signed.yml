  Candidate 0.2.1, versionCode 3. The build source includes corrected
  Fastlane descriptions and the official logo assets, not a stable release tag.
  Message polling is experimental and actual delivery is not validated.
  Native recovery was tested in an Android 15 emulator using local HTML;
  this did not test authenticated services or actual message delivery.
  Web pages automatically load Google Fonts (fonts.googleapis.com and
  fonts.gstatic.com); the homepage also loads WordPress emoji from s.w.org.
  Third-party cookies are enabled. These web requests are now disclosed
