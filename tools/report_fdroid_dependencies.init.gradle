import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// An observation task only: no production dependency or build setting is changed.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('fdroidDependencyEvidence') {
        doLast {
            def configuration = app.configurations.getByName('releaseRuntimeClasspath')
            def artifacts = configuration.resolvedConfiguration.resolvedArtifacts
            def components = configuration.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof ModuleComponentIdentifier }
                .collect { component ->
                    def id = component.id
                    [group: id.group, name: id.module, version: id.version,
                     artifacts: artifacts.findAll { it.moduleVersion.id.toString() == id.toString() }
                         .collect { artifact ->
                             [file: artifact.file.name,
                              sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
                         }.sort { it.file }]
                }.sort { a, b -> (a.group + ':' + a.name) <=> (b.group + ':' + b.name) }
            new File(System.getenv('LEFIL_RUNTIME_REPORT')).text = JsonOutput.prettyPrint(JsonOutput.toJson(components)) + '\n'
            println "Observed ${components.size()} selected release runtime modules; no APK or tests built"
        }
    }
}
